<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALOHA 4-CUT | 하와이 네컷 - 공식 포토부스</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JEXQP29WS4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JEXQP29WS4');
    </script>
    <meta name="google-adsense-account" content="ca-pub-3113946683105567">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3113946683105567"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🌺 ALOHA 4-CUT</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">포토부스</a></li>
                <li><a href="guide.html">이용 가이드</a></li>
                <li><a href="about.html">브랜드 스토리</a></li>
                <li><a href="privacy.html">개인정보처리방침</a></li>
            </ul>
        </div>
    </nav>

    <div class="app-container">
        <header>
            <h1>🌺 ALOHA 4-CUT 🏝️</h1>
            <p>하와이의 파도와 함께 인생 네컷을 남겨보세요!</p>
        </header>

        <main>
            <div class="booth-container">
                <div class="camera-mode-selector">
                    <button id="mode-desktop" class="active">💻 데스크탑 모드</button>
                    <button id="mode-mobile">📱 모바일 모드</button>
                </div>

                <div class="video-wrapper">
                    <video id="webcam" autoplay playsinline></video>
                    <div id="capture-counter" class="hidden">0 / 4</div>
                    <div id="flash" class="hidden"></div>
                </div>

                <div class="controls">
                    <button id="start-btn">카메라 켜기</button>
                    <button id="capture-btn" disabled>촬영하기 (0/4)</button>
                    <button id="download-btn" class="hidden">사진 저장하기</button>
                </div>
            </div>

            <div id="result-container" class="hidden">
                <h2>완성된 당신의 네컷! 📸</h2>
                <div class="photo-strip-wrapper">
                    <canvas id="result-canvas"></canvas>
                </div>
            </div>

            <section class="inquiry-section">
                <div class="form-container">
                    <h3>🤙 문의 및 추천하기</h3>
                    <p>Photobooth를 더 좋게 만들 아이디어가 있나요?</p>
                    
                    <div data-fs-success class="form-status-msg success hidden">감사합니다! 성공적으로 전송되었습니다. 🏝️</div>
                    <div data-fs-error class="form-status-msg error hidden">문제가 발생했습니다. 다시 시도해주세요.</div>

                    <form id="inquiry-form">
                        <div class="form-group">
                            <label for="name">성함</label>
                            <input type="text" id="name" name="name" placeholder="당신의 이름을 알려주세요" data-fs-field required>
                            <span data-fs-error="name" class="field-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">이메일 주소</label>
                            <input type="email" id="email" name="email" placeholder="연락받을 이메일을 입력하세요" data-fs-field required>
                            <span data-fs-error="email" class="field-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="message">문의 및 추천 내용</label>
                            <textarea id="message" name="message" rows="4" placeholder="자유롭게 내용을 적어주세요" data-fs-field required></textarea>
                            <span data-fs-error="message" class="field-error"></span>
                        </div>
                        <button type="submit" class="submit-btn" data-fs-submit-btn>보내기 🏝️</button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Aloha Photobooth</p>
        </footer>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', { 
            formElement: '#inquiry-form', 
            formId: 'xkoabpye',
            onSuccess: function() {
                document.querySelector('[data-fs-success]').classList.remove('hidden');
                document.getElementById('inquiry-form').classList.add('hidden');
            }
        });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
    <script src="main.js"></script>
</body>
</html>
