<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALOHA 4-CUT | 하와이 네컷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🌺 ALOHA 4-CUT 🏝️</h1>
            <p>하와이의 파도와 함께 인생 네컷을 남겨보세요!</p>
        </header>

        <main>
            <div class="booth-container">
                <div class="video-wrapper">
                    <video id="webcam" autoplay playsinline></video>
                    <div id="countdown" class="hidden">3</div>
                    <div id="flash" class="hidden"></div>
                </div>

                <div class="controls">
                    <button id="start-btn">카메라 켜기</button>
                    <button id="capture-btn" disabled>촬영 시작!</button>
                    <button id="download-btn" class="hidden">사진 저장하기</button>
                </div>
            </div>

            <div id="result-container" class="hidden">
                <h2>완성된 당신의 네컷! 📸</h2>
                <div class="photo-strip-wrapper">
                    <canvas id="result-canvas"></canvas>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Aloha Photobooth</p>
        </footer>
    </div>

    <!-- Hidden canvas for processing individual frames -->
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script src="main.js"></script>
</body>
</html>
